name: BarberMe Enterprise 8-Stage CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ---------------------------------------------------------
  # Estágio 1: Lint (Uncle Bob - Code Quality & Complexity)
  # ---------------------------------------------------------
  stage-1-lint:
    name: 1. 📏 Lint & Complexity Check (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'npm' }
      - run: npm install --no-audit
      - run: npm run lint

  # ---------------------------------------------------------
  # Estágio 2: Typecheck (TypeScript Static Type Check)
  # ---------------------------------------------------------
  stage-2-typecheck:
    name: 2. 🔍 TypeScript Typecheck (tsc)
    runs-on: ubuntu-latest
    needs: stage-1-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'npm' }
      - run: npm install --no-audit
      - run: npm run typecheck

  # ---------------------------------------------------------
  # Estágio 3: Unit Tests (Vitest Domain Engine)
  # ---------------------------------------------------------
  stage-3-unit:
    name: 3. 🧪 Unit Tests (Clock Engine & Domain)
    runs-on: ubuntu-latest
    needs: stage-2-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'npm' }
      - run: npm install --no-audit
      - run: npm run test:unit

  # ---------------------------------------------------------
  # Estágio 4: Integration Tests (API REST & Services)
  # ---------------------------------------------------------
  stage-4-integration:
    name: 4. 🔗 Integration Tests (REST API & Services)
    runs-on: ubuntu-latest
    needs: stage-3-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'npm' }
      - run: npm install --no-audit
      - run: npm run test:integration

  # ---------------------------------------------------------
  # Estágio 5: Tenant & Security (Isolation & Clean Boundaries)
  # ---------------------------------------------------------
  stage-5-tenant-security:
    name: 5. 🏢 Tenant Isolation & Security Guard
    runs-on: ubuntu-latest
    needs: stage-4-integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'npm' }
      - run: npm install --no-audit
      - run: npm run arch:check
      - run: npm run test:tenant

  # ---------------------------------------------------------
  # Estágio 6: Migrations (Schema Drift & Backward Compatibility)
  # ---------------------------------------------------------
  stage-6-migrations:
    name: 6. 🔄 Database Migrations & Schema Check
    runs-on: ubuntu-latest
    needs: stage-5-tenant-security
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'npm' }
      - run: npm install --no-audit
      - run: npm run schema:check
      - run: npm run test:migrations

  # ---------------------------------------------------------
  # Estágio 7: Build (TypeScript Build & Docker Production Image)
  # ---------------------------------------------------------
  stage-7-build:
    name: 7. 🏗️ Build & Production Docker Image
    runs-on: ubuntu-latest
    needs: stage-6-migrations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'npm' }
      - run: npm install --no-audit
      - run: npm run build
      - run: npm run budget:check
      - run: docker build -t barberme:latest .

  # ---------------------------------------------------------
  # Estágio 8: E2E / Happy Path (Playwright Headless Browser Test)
  # ---------------------------------------------------------
  stage-8-e2e-happy-path:
    name: 8. 🎭 E2E Happy Path (Playwright Headless Browser)
    runs-on: ubuntu-latest
    needs: stage-7-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'npm' }
      - run: npm install --no-audit
      - run: npm run build
      - name: 🎭 Instalar Navegador Chromium para Playwright
        run: npx playwright install chromium --with-deps
      - name: 🎭 Executar Testes E2E Happy Path
        run: npm run test:e2e
